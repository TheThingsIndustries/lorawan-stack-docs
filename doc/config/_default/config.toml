title = "The Things Stack for LoRaWAN"

baseURL = "http://localhost/"

theme = "the-things-stack"

disableKinds = [
  "taxonomy",
  "RSS",
]

enableGitInfo = true

languageCode = "en-us"
languageName = "English"

pygmentsCodeFences = true
pygmentsUseClasses = true

[params]
  description = """\
    Documentation for The Things Stack, the LoRaWAN® network server by The Things Industries: \
    getting started, gateways, devices, integrations, API and deployment guides."""
  keywords = []
  github_repository = "https://github.com/TheThingsIndustries/lorawan-stack-docs"
  github_repository_edit = "https://github.com/TheThingsIndustries/lorawan-stack-docs/blob/master/doc/content"
  tts_github_repository = "https://github.com/TheThingsNetwork/lorawan-stack"
  version = "3.37.0"

  # Native search (Pagefind). The index is built after Hugo; see the Makefile.
  [params.search]
    enabled = true
    # Order of the section filters in the search dialog
    sections = [
      "Getting started", "Cloud", "Enterprise", "Hardware", "Integrations",
      "API", "Concepts", "CLI reference", "Release notes",
    ]
    [params.search.help]
      forum = "https://www.thethingsnetwork.org/forum/search?q="
      support = "https://www.thethingsindustries.com/support"
    # Shown in the search dialog before the reader types
    [[params.search.popular]]
      page = "/getting-started"
    [[params.search.popular]]
      page = "/hardware/gateways/concepts/adding-gateways"
    [[params.search.popular]]
      page = "/hardware/devices/adding-devices"
    [[params.search.popular]]
      page = "/integrations/payload-formatters"
    [[params.search.popular]]
      page = "/integrations/webhooks"
    [[params.search.popular]]
      page = "/api/concepts/auth"

  # Top navigation groups, used only at medium widths where the full navigation
  # does not fit. Items are section names of pages in the "main" menu.
  [[params.navgroups]]
    name = "Deployment"
    items = ["cloud", "enterprise"]
  [[params.navgroups]]
    name = "Build"
    items = ["integrations", "api", "hardware"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menu]
  [[menu.contributing]]
    name = "GitHub"
    url = "https://github.com/TheThingsIndustries/lorawan-stack-docs"
    weight = 1

  [[menu.about_us]]
    name = "The Things Industries"
    url = "https://www.thethingsindustries.com"
    weight = 3

  [[menu.buttons]]
    name = "Get The Things Stack"
    url = "https://www.thethingsindustries.com/stack/plans/"
    weight = 1
    [menu.buttons.params]
      target = "_blank"

  [[menu.sitemap]]
    name = "View our Sitemap"
    url = "https://www.thethingsindustries.com/docs/sitemap/"
    weight = 2
